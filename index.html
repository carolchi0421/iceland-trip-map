<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Iceland Plan 2026</title>
<meta name="theme-color" content="#0d1f33">
<meta name="description" content="冰島自駕環島互動行程地圖 9/24–10/3 2026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ══════════════════════════════════════════════════
   DESIGN SYSTEM — Iceland Plan 2026
   4-level bg · 3-level text · Iceland-inspired palette
   ══════════════════════════════════════════════════ */
:root{
  /* Background layers (4 levels, clear hierarchy) */
  --bg0: #030a14;   /* deepest – page base            */
  --bg1: #0d1a2b;   /* sidebar surface                */
  --bg2: #10202f;   /* cards / panels                 */
  --bg3: #17293d;   /* elevated / hover               */

  /* Borders (3 levels) */
  --bd1: #0f2030;   /* very subtle separator          */
  --bd2: #183448;   /* standard card border           */
  --bd3: #224460;   /* visible / active border        */

  /* Text (3 levels) */
  --t1:  #ddeeff;   /* primary – headings             */
  --t2:  #93b6cf;   /* secondary – body               */
  --t3:  #6b90ab;   /* muted – metadata               */

  /* Brand accents */
  --gold: #f2c53d;   /* midnight sun gold              */
  --gold-bg: rgba(242,197,61,.08);
  --gold-bd: rgba(242,197,61,.22);
  --sky:  #48b8e8;   /* glacial ice blue               */
  --danger: #e04848;
  --success:#40c880;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif;
  background:var(--bg0);color:var(--t1);
  height:100vh;display:flex;overflow:hidden;
}

/* ──────────── SIDEBAR ──────────── */
#sidebar{
  width:600px;flex-shrink:0;
  display:flex;flex-direction:column;
  background:var(--bg1);
  border-right:1px solid var(--bd2);
  box-shadow:6px 0 32px rgba(0,0,0,.55);
  overflow:hidden;z-index:400;
}

/* Drag handle to resize sidebar (desktop) */
#resizer{
  width:6px;flex-shrink:0;cursor:col-resize;
  background:var(--bd1);
  transition:background .15s;
  position:relative;z-index:401;
}
#resizer:hover,#resizer.dragging{background:var(--sky)}
#resizer::before{
  content:'';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:2px;height:34px;border-radius:2px;
  background:var(--bd3);
}
#resizer:hover::before,#resizer.dragging::before{background:#cdeaff}

/* Header – aurora gradient */
.sb-head{
  flex-shrink:0;padding:14px 16px 12px;
  background:linear-gradient(150deg,#0d1f33 0%,#12273d 60%,#0f2036 100%);
  border-bottom:1px solid var(--bd2);
}
.sb-title{
  font-size:22px;font-weight:900;color:var(--gold);
  letter-spacing:.5px;margin-bottom:2px;
  text-shadow:0 0 20px rgba(242,197,61,.25);
}
.sb-en{font-size:9px;color:var(--t3);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
.sb-chips{display:flex;gap:5px;flex-wrap:wrap}
/* spot search */
.sb-search{position:relative;margin-top:9px}
#spotSearch{
  width:100%;box-sizing:border-box;padding:7px 11px;border-radius:7px;
  background:var(--bg0);border:1px solid var(--bd2);color:var(--t1);
  font-size:12px;font-family:inherit;outline:none;transition:border-color .15s;
}
#spotSearch:focus{border-color:var(--sky)}
#spotSearch::placeholder{color:var(--t3)}
.search-results{
  position:absolute;top:100%;left:0;right:0;z-index:200;margin-top:4px;
  background:var(--bg2);border:1px solid var(--bd3);border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;display:none;
}
.search-results.on{display:block}
.search-item{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;
  border-bottom:1px solid var(--bd1);transition:background .12s}
.search-item:last-child{border-bottom:none}
.search-item:hover,.search-item.sel{background:var(--bg3)}
.search-item .si-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:900}
.search-item .si-zh{font-size:12px;color:var(--t1)}
.search-item .si-en{font-size:9px;color:var(--t3)}
.search-empty{padding:9px 11px;font-size:11px;color:var(--t3)}
.chip{
  padding:3px 9px;border-radius:10px;font-size:10px;
  background:rgba(255,255,255,.04);border:1px solid var(--bd2);color:var(--t3);
  transition:border-color .15s;
}
.chip b{color:var(--sky)}


/* Edit bar */
.edit-bar{
  flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:6px 12px;background:var(--bg0);border-bottom:1px solid var(--bd1);
}
.edit-bar small{font-size:10px;color:var(--t3);flex:1}
.ebtn{
  padding:4px 10px;border-radius:5px;font-size:10.5px;
  border:1px solid var(--bd2);background:transparent;
  color:var(--t3);cursor:pointer;font-family:inherit;transition:all .15s;
}
.ebtn:hover{color:var(--t1);border-color:var(--bd3);background:var(--bg2)}
.ebtn.on{color:var(--gold);border-color:var(--gold);background:var(--gold-bg);
  box-shadow:0 0 8px rgba(242,197,61,.15)}
#resetBtn{color:#c04040;border-color:#3a1010}
#resetBtn:hover{background:rgba(200,60,60,.08);color:#e06060;border-color:#602020}

/* Edit-mode highlight */
body.editing .ep{cursor:pointer;border-bottom:1.5px dashed var(--gold);padding-bottom:1px}
body.editing .ep:hover{background:var(--gold-bg);border-radius:3px}
.ep-input{
  background:var(--bg0);border:1.5px solid var(--gold);border-radius:5px;
  color:var(--gold);font-size:12px;font-family:inherit;
  padding:3px 8px;min-width:160px;outline:none;
  box-shadow:0 0 10px rgba(242,197,61,.12);
}

/* ──────────── TABS ──────────── */
.tab-bar{flex-shrink:0;background:var(--bg1);border-bottom:1px solid var(--bd2)}
.all-btn{
  display:flex;align-items:center;gap:7px;
  width:100%;padding:9px 15px;
  background:transparent;border:none;border-bottom:1px solid var(--bd2);
  color:var(--t2);font-size:12px;cursor:pointer;
  font-family:inherit;transition:all .18s;text-align:left;
}
.all-btn:hover{color:var(--gold);background:var(--gold-bg)}
.all-btn.on{color:var(--gold);background:var(--gold-bg);
  border-bottom:2px solid var(--gold);box-shadow:0 2px 12px rgba(242,197,61,.08)}
.dtabs{display:grid;grid-template-columns:repeat(10,1fr)}
.dtab{
  padding:7px 2px 6px;background:transparent;
  border:none;border-right:1px solid var(--bd2);
  color:var(--t2);font-size:9px;font-weight:700;
  cursor:pointer;transition:all .15s;font-family:inherit;text-align:center;
  position:relative;
}
.dtab .n{font-size:12px;display:block}
.dtab .d{font-size:9px;font-weight:400;display:block;margin-top:1px;color:var(--t3)}
.dtab:hover{color:var(--t1);background:var(--bg2)}
/* Active tab: colored bottom border + subtle glow */
.dtab.on{color:#fff;background:var(--bg2)}
.dtab.on .d{color:rgba(255,255,255,.6)}
.dtab.on::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:var(--dc);box-shadow:0 0 8px var(--dc);
}
.top-btns{display:flex}
.top-btns .all-btn{flex:1;width:auto;border-right:1px solid var(--bd2);justify-content:center}
.top-btns .all-btn:last-child{border-right:none}

/* ──────────── PREP PANEL (行前準備) ──────────── */
.prep-wrap{padding:14px 14px 40px}
.prep-sec{margin-bottom:22px}
.prep-h{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;
  color:var(--gold);margin:0 0 4px}
.prep-sub{font-size:10px;color:var(--t3);margin:0 0 10px}
/* booking dashboard */
.book-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;margin-bottom:7px;
  background:var(--bg2);border:1px solid var(--bd2);border-radius:8px}
.book-item.done{border-color:rgba(39,174,96,.35);background:rgba(39,174,96,.06)}
.book-badge{flex-shrink:0;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:1px}
.book-badge.yes{background:rgba(39,174,96,.16);color:#4fd07f}
.book-badge.no{background:rgba(242,197,61,.14);color:var(--gold)}
.book-body{flex:1;min-width:0}
.book-name{font-size:12.5px;color:var(--t1);font-weight:600}
.book-meta{font-size:10px;color:var(--t2);margin-top:2px}
/* packing checklist */
.pack-prog{font-size:11px;color:var(--sky);font-weight:700}
.pack-cat{margin-bottom:12px}
.pack-cat-h{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;
  letter-spacing:.05em;margin:0 0 5px;border-left:3px solid var(--sky);padding-left:7px}
.pack-item{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:5px;cursor:pointer;
  font-size:12px;color:var(--t1);transition:background .12s}
.pack-item:hover{background:var(--bg2)}
.pack-item input{width:15px;height:15px;accent-color:var(--sky);cursor:pointer;flex-shrink:0}
.pack-item.checked span{color:var(--t3);text-decoration:line-through}
.info-links{display:flex;flex-wrap:wrap;gap:8px}
.info-links .gmap-btn{margin-top:0;font-size:11px;padding:6px 11px}

/* ──────────── PANELS ──────────── */
#panels{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;display:none}
.panel.on{display:block}
.panel::-webkit-scrollbar{width:4px}
.panel::-webkit-scrollbar-track{background:transparent}
.panel::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.panel::-webkit-scrollbar-thumb:hover{background:var(--bd3)}

/* ──────────── OVERVIEW ──────────── */
.ov-top{
  padding:12px 14px 10px;
  background:linear-gradient(135deg,#0d1f33,#12273d);
  border-bottom:1px solid var(--bd2);
  position:sticky;top:0;z-index:10;
}
.ov-top h2{font-size:14px;color:var(--gold);font-weight:800;margin-bottom:2px}
.ov-top p{font-size:10px;color:var(--t3)}
.stats-row{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.stat{
  padding:4px 10px;border-radius:6px;font-size:10px;
  background:var(--bg2);border:1px solid var(--bd2);
}
.stat span{color:var(--t3);display:block;font-size:8px;margin-bottom:1px}
.stat b{color:var(--sky);font-size:11px}

/* Discrepancy box */
.diff-wrap{
  margin:10px 12px;border-radius:0 8px 8px 0;overflow:hidden;
  border:1px solid rgba(232,130,40,.18);border-left:3px solid #d07020;
  background:rgba(232,130,40,.04);
}
.diff-toggle{
  width:100%;padding:8px 12px;background:transparent;border:none;
  display:flex;align-items:center;justify-content:space-between;
  color:#b87020;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;
}
.diff-toggle:hover{color:#d08030}
.diff-body{padding:0 12px 8px;display:none}
.diff-body.open{display:block}
.di{font-size:10.5px;color:var(--t3);padding:4px 0;
  border-bottom:1px solid var(--bd1);line-height:1.55}
.di:last-child{border:none}
.fix{color:var(--success);font-weight:700}
.wrn{color:#c09028;font-weight:700}

/* Overview day cards */
.ov-list{padding:8px 12px 16px}
.ov-card{
  display:flex;align-items:stretch;margin-bottom:5px;
  border-radius:8px;overflow:hidden;
  border:1px solid var(--bd2);cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .1s;
}
.ov-card:hover{
  border-color:var(--bd3);
  box-shadow:0 2px 12px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.03);
  transform:translateX(1px);
}
.ov-stripe{width:5px;flex-shrink:0;transition:width .15s}
.ov-card:hover .ov-stripe{width:6px}
.ov-body{flex:1;padding:8px 11px;background:var(--bg2)}
.ov-row1{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.ov-num{
  width:22px;height:22px;border-radius:50%;
  font-size:9px;font-weight:900;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 1px 5px rgba(0,0,0,.4);
}
.ov-title{font-size:12px;font-weight:700;color:var(--t1);flex:1}
.ov-date{font-size:9px;color:var(--t3)}
.ov-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.ov-tag{
  padding:1px 6px;border-radius:5px;font-size:9px;
  background:rgba(255,255,255,.03);border:1px solid var(--bd1);color:var(--t3);
}
.ov-bot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ov-acc{font-size:9px;color:var(--t3)}
.ov-acc b{color:var(--t2)}
.ov-km{font-size:9px;color:var(--t3);margin-left:auto}
.ov-price{font-size:11px;font-weight:700}

/* ──────────── DAY PANEL ──────────── */
.d-head{
  position:sticky;top:0;z-index:10;padding:12px 14px 11px;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}
/* Diagonal gradient on header using day color */
.d-head::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.06) 0%,transparent 60%);
}
.d-head-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.d-num{font-size:10px;opacity:.75;letter-spacing:.3px}
.d-name{font-size:17px;font-weight:900;color:#fff;margin:2px 0;
  text-shadow:0 1px 6px rgba(0,0,0,.4);}
.d-meta{display:flex;gap:10px;font-size:10px;color:rgba(255,255,255,.65);
  margin-top:3px;flex-wrap:wrap}
.d-date-badge{font-size:12px;font-weight:800;color:rgba(255,255,255,.95);
  background:rgba(0,0,0,.2);padding:2px 8px;border-radius:6px;white-space:nowrap}

.d-infobar{display:flex;border-bottom:1px solid var(--bd1);background:var(--bg2)}
.dib{flex:1;padding:7px 10px;border-right:1px solid var(--bd1);display:flex;flex-direction:column}
.dib:last-child{border-right:none}
.dib-l{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.dib-v{font-size:11px;font-weight:700;color:var(--sky)}

/* Tips box */
.tips-box{
  margin:10px 12px;padding:10px 12px;
  background:var(--gold-bg);
  border:1px solid var(--gold-bd);
  border-left:3px solid var(--gold);border-radius:0 8px 8px 0;
}
.tips-title{font-size:9px;color:var(--gold);letter-spacing:.6px;margin-bottom:5px;font-weight:800;text-transform:uppercase}
.tip-item{font-size:11px;color:var(--t2);line-height:1.65;padding-left:12px;position:relative}
.tip-item::before{content:"·";position:absolute;left:4px;color:var(--gold);font-weight:900}

/* Flight box */
.flight-box{
  margin:10px 12px;padding:10px 12px;
  border:1px solid rgba(72,184,232,.15);
  border-left:3px solid var(--sky);border-radius:0 8px 8px 0;
  background:rgba(72,184,232,.04);
}
.flight-title{font-size:9px;color:var(--sky);letter-spacing:.6px;margin-bottom:6px;font-weight:800;text-transform:uppercase}
.flight-row{display:flex;align-items:center;gap:9px;margin-bottom:5px;font-size:11px}
.flight-row:last-child{margin-bottom:0}
.flight-who{
  padding:2px 8px;border-radius:4px;
  background:rgba(72,184,232,.12);color:var(--sky);
  font-size:10px;font-weight:700;min-width:38px;text-align:center;
}
.flight-info{color:var(--t2)}

/* Timeline */
.timeline{padding:10px 12px 6px}
.tl-gap{
  display:flex;align-items:center;gap:8px;
  padding:2px 0 2px 11px;font-size:10px;color:var(--t3);font-style:italic;
}
.tl-gap-line{width:2px;height:20px;opacity:.25;flex-shrink:0}
.tl-row{
  display:flex;align-items:flex-start;gap:9px;
  padding:8px 7px;border-radius:10px;cursor:pointer;
  transition:background .12s,box-shadow .12s;margin-bottom:1px;
}
.tl-row:hover{background:rgba(255,255,255,.035);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.tl-left{display:flex;flex-direction:column;align-items:center;width:28px;flex-shrink:0}
.tl-dot{
  width:28px;height:28px;border-radius:50%;
  font-size:11px;font-weight:900;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.45);
  transition:transform .12s,box-shadow .12s;
}
.tl-row:hover .tl-dot{transform:scale(1.08);box-shadow:0 3px 12px rgba(0,0,0,.5)}
.tl-vline{width:2px;flex:1;min-height:12px;opacity:.25;margin-top:4px;border-radius:1px}
.tl-main{flex:1;min-width:0}
.tl-time{font-size:9px;font-weight:700;margin-bottom:2px;letter-spacing:.3px}
.tl-zh{font-size:13px;font-weight:700;color:var(--t1);line-height:1.3}
.tl-en{font-size:10px;color:var(--t3);margin:2px 0 4px}
.tl-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.tt{padding:2px 7px;border-radius:5px;font-size:10px}
.tt.fee{background:rgba(230,185,40,.07);color:#c8a030;border:1px solid rgba(230,185,40,.15)}
.tt.dur{background:rgba(72,184,232,.07);color:#4898b8;border:1px solid rgba(72,184,232,.14)}
.tt.tag{background:rgba(64,200,128,.06);color:#40a870;border:1px solid rgba(64,200,128,.12)}
.tt.warn{background:rgba(220,80,80,.06);color:#b85050;border:1px solid rgba(220,80,80,.12)}
.tl-desc{font-size:10.5px;color:var(--t3);line-height:1.65;margin-top:5px}
.tl-photo{
  width:52px;height:52px;flex-shrink:0;
  border-radius:50%;background:var(--bg3) center/cover no-repeat;
  margin-top:2px;border-width:2.5px;border-style:solid;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
  transition:transform .15s,box-shadow .15s;
}
.tl-row:hover .tl-photo{transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,.5)}

/* Google Maps button */
.gmap-btn{
  display:inline-flex;align-items:center;gap:3px;
  margin-top:6px;padding:3px 9px;border-radius:5px;font-size:10px;
  background:rgba(66,133,244,.08);border:1px solid rgba(66,133,244,.18);
  color:#5888e8;text-decoration:none;transition:all .15s;cursor:pointer;
}
.gmap-btn:hover{background:rgba(66,133,244,.18);color:#88aaff;border-color:rgba(66,133,244,.35)}
.book-btn{
  display:inline-flex;align-items:center;gap:3px;
  margin-top:6px;margin-left:6px;padding:3px 9px;border-radius:5px;font-size:10px;
  background:rgba(39,174,96,.10);border:1px solid rgba(39,174,96,.28);
  color:#3fae6a;text-decoration:none;transition:all .15s;cursor:pointer;
}
.book-btn:hover{background:rgba(39,174,96,.2);color:#5fd48a;border-color:rgba(39,174,96,.45)}

/* Restaurants */
.section-head{
  font-size:9px;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;
  padding:8px 13px 4px;border-top:1px solid var(--bd1);margin:4px 0 0;
}
.rest-card{
  margin:0 12px 5px;padding:8px 11px;
  background:var(--bg2);
  border:1px solid var(--bd1);border-radius:8px;
  transition:border-color .12s;
}
.rest-card:hover{border-color:var(--bd2)}
.rest-name{font-size:12px;font-weight:700;color:var(--t1);margin-bottom:2px}
.rest-type{font-size:9px;margin-bottom:3px;font-weight:700;letter-spacing:.3px}
.rest-note{font-size:10.5px;color:var(--t3);line-height:1.55}

/* Accommodation */
.acc-block{
  margin:6px 12px 16px;padding:12px 13px;
  background:var(--bg2);
  border:1px solid var(--bd1);
  border-radius:0 10px 10px 0;border-left-width:3px;border-left-style:solid;
}
.acc-label{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.acc-name{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:3px}
.acc-sub{font-size:10.5px;color:var(--t3);margin-bottom:7px;line-height:1.5}
.acc-price-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acc-price-badge{
  padding:4px 11px;border-radius:6px;font-size:12px;font-weight:700;
  border-width:1px;border-style:solid;letter-spacing:.3px;
}

.acc-team-note{font-size:9px;color:var(--t3);margin-top:3px}

/* ──────────── MAP ──────────── */
#map{flex:1;height:100vh}

/* Leaflet popup */
.leaflet-popup-content-wrapper{
  background:#12233a!important;border:1px solid #274566!important;
  border-radius:12px!important;
  box-shadow:0 12px 40px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.04)!important;
  padding:0!important;
}
.leaflet-popup-content{margin:0!important}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-close-button{
  color:var(--t3)!important;font-size:18px!important;
  top:8px!important;right:10px!important;z-index:10;
  transition:color .12s!important;
}
.leaflet-popup-close-button:hover{color:var(--t1)!important}
.pw{width:264px;border-radius:12px;overflow:hidden}
.pw-img{
  width:100%;height:148px;background:var(--bg3) center/cover no-repeat;
  position:relative;
}
.pw-img-grad{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(18,35,58,.9) 0%,transparent 55%);
}
.pw-badge{
  position:absolute;bottom:9px;left:11px;
  padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.pw-body{padding:10px 14px 13px;background:#12233a}
.pw-zh{font-size:15px;font-weight:900;color:#fff;line-height:1.2}
.pw-en{font-size:10px;color:var(--t3);margin-top:3px}
.pw-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.pw-tag{
  padding:2px 7px;border-radius:5px;font-size:10px;
  background:rgba(255,255,255,.05);color:var(--t3);border:1px solid var(--bd1);
}
.pw-links{display:flex;gap:6px;margin-top:9px}
.pw-wiki{
  padding:3px 8px;border-radius:5px;font-size:10px;color:var(--t3);
  text-decoration:none;border:1px solid var(--bd2);background:transparent;
  transition:all .14s;
}
.pw-wiki:hover{color:var(--t1);background:var(--bg3);border-color:var(--bd3)}
.pw-detail{margin-top:10px;padding-top:9px;border-top:1px solid #274566}
.pw-detail-h{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--gold);margin-bottom:5px;text-transform:uppercase}
.pw-detail-body{font-size:10.5px;line-height:1.65;color:var(--t2);white-space:pre-line}
.pw-detail::-webkit-scrollbar{width:4px}
.pw-detail::-webkit-scrollbar-track{background:transparent}
.pw-detail::-webkit-scrollbar-thumb{background:var(--bd3);border-radius:2px}

/* ── Map: drive-time segment labels + direction arrows + reset button ── */
.seg-label{
  position:absolute;transform:translate(-50%,-190%);white-space:nowrap;
  padding:2px 7px;border-radius:9px;font-size:10px;font-weight:700;
  background:rgba(10,22,36,.9);border:1px solid var(--bd3);color:var(--t1);
  box-shadow:0 2px 8px rgba(0,0,0,.55);pointer-events:none;
}
.seg-label.warn{
  border-color:var(--gold);color:var(--gold);
  background:rgba(38,29,7,.94);cursor:pointer;pointer-events:auto;
}
.seg-arrow{
  font-size:14px;line-height:16px;text-align:center;font-weight:900;
  text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;
}
.map-reset-btn{
  padding:6px 11px;border-radius:6px;font-size:12px;font-family:inherit;
  background:rgba(10,22,36,.92);border:1px solid var(--bd3);color:var(--t1);
  cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5);transition:all .15s;
}
.map-reset-btn:hover{color:var(--gold);border-color:var(--gold);background:var(--bg3)}

/* Photo shimmer loading animation */
@keyframes shimmer{
  0%{background-position:-200% center}
  100%{background-position:200% center}
}
.tl-photo.loading,.pw-img.loading{
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 50%,var(--bg3) 75%)!important;
  background-size:200% 100%!important;
  animation:shimmer 1.4s infinite linear;
}

/* ──────────── RESPONSIVE (mobile / narrow) ──────────── */
/* Whole page scrolls naturally; map on top (fixed height), details below. */
@media (max-width:820px){
  html{height:auto}
  body{
    flex-direction:column;height:auto;min-height:100dvh;
    overflow-x:hidden;overflow-y:auto;
  }
  #sidebar{
    order:1;width:100%!important;min-width:0;height:auto;flex:none;
    overflow:visible;border-right:none;border-bottom:1px solid var(--bd2);
    box-shadow:none;
  }
  #resizer{display:none}
  #map{order:2;width:100%;height:56vh;flex:none}
  /* panels flow in normal document flow so the page (not an inner box) scrolls */
  #panels{flex:none;height:auto;overflow:visible;position:static}
  .panel{position:static;inset:auto;height:auto;overflow:visible}
  /* keep day tabs reachable while scrolling; drop inner sticky headers to avoid overlap */
  .tab-bar{position:sticky;top:0;z-index:50}
  .d-head,.ov-top{position:static}
  .sb-title{font-size:19px}
  .sb-en{font-size:8px}
}
@media (max-width:420px){
  #map{height:50vh}
  .dtab .n{font-size:11px}
  .dtab{padding:6px 1px 5px}
}

/* ──────────── PRINT / PDF 備份（線性攤平全行程）──────────── */
@media print{
  @page{margin:12mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  body{display:block!important;flex-direction:column}
  #map,#resizer,.edit-bar,.tab-bar,.sb-search,.map-reset-btn,.leaflet-control,
  .gmap-btn,.book-btn,.acc-edit-hint,.tl-photo,.pw{display:none!important}
  #sidebar{width:100%!important;height:auto!important;display:block!important;border:none!important;box-shadow:none!important}
  #panels{position:static!important;height:auto!important;overflow:visible!important;display:block!important}
  .panel{position:static!important;inset:auto!important;display:block!important;height:auto!important;overflow:visible!important;
    page-break-after:always;border-bottom:2px solid #999;padding:0 0 8px;margin-bottom:8px}
  #panel-prep{display:none!important}          /* 打包/預約不需印 */
  .sb-head{background:#fff!important;border-bottom:2px solid #000}
  .sb-title,.prep-h,.d-title{color:#000!important;text-shadow:none!important}
  .tl-zh,.tl-en,.tl-desc,.tl-time,.acc-name,.acc-sub,.rest-name,.rest-note,.ov-day-title,.tip-item,.d-head *{color:#000!important}
  .ov-top,.d-head{background:#fff!important;position:static!important;color:#000!important}
  *{box-shadow:none!important;text-shadow:none!important}
}

 'kolugljufur':'行程：轉入 715 號道路開 6 分鐘即抵達。站在鐵橋上俯瞰急流切穿玄武岩峽谷的壯觀畫面，可沿谷側安全步道散步拍照。',
 'blonduos':'拍照：先在 Blönduóskirkja 鯨魚教堂外觀拍極具未來感的建築線條（5–10 分鐘）。\n午餐：到對面的 N1 加油站吃冰島經典羊肉湯與熱狗，或選鎮上餐廳。\n補給：順便在 Krónan 超市採買這兩天的車上零食與飲料，並在此上廁所。',
 'akureyri':'行程：開下高地後俯瞰美麗峽灣，直接開進市區辦理飯店 check-in。\n傍晚：距日落還有 3 個多小時，可漫步老城區。\n亮點：全城紅綠燈都是「❤️ 愛心形狀」，路口停等時記得拍照；也可爬上大教堂階梯俯瞰港口。',
 'godafoss':'行程：停好車後，先走左岸看全景，再走右岸近距離感受水花。離開前在遊客中心上廁所。',
 'grjotagja':'行程：順著小階梯下到神祕的地裂洞穴中，欣賞自帶藍光的地下泉水。',
 'hverfell':'行程：大魔王景點。鞋帶綁緊，一口氣爬上陡坡。登頂那一刻，巨大全黑完美圓形火山口會直接震撼視覺。拍完外星科幻感照片後下山。',
 'dimmuborgir':'午餐：先在入口遊客中心的 Kaffi Borgir 吃午餐（有湯、漢堡、熱狗），順便上廁所。\n健行：吃飽後走進黑色城堡的「Kirkja 教堂環線」步道，觀賞大自然冷卻形成的巨石迷宮。',
 'hverir':'行程：一下車就聞到濃烈硫磺味。走在橘紅色大地上，看滾燙灰色泥漿在腳邊冒泡、噴氣孔轟轟作響，非常像置身火星。',
 'myvatn-baths':'行程：登記入場，跳進溫熱的乳藍色溫泉池、敷上礦物泥，一邊泡湯一邊欣賞秋季北部的夕陽晚霞，超級療癒！\n（旺季營業至 22:00，末班入場 21:30）',
 'krafla':'行程：清晨抵達，人煙稀少。走到火口湖畔拍攝平靜如鏡的藍色湖水；沿途會經過地熱發電廠，地表不斷冒出蒸汽。',
 'viti':'行程：清晨抵達，人煙稀少。走到火口湖畔拍攝平靜如鏡的藍色湖水；沿途會經過地熱發電廠，地表不斷冒出蒸汽。',
 'dettifoss':'行程：停好車後先在停車場上廁所，順著步道往下走 15 分鐘，震耳欲聾的瀑布聲傳來，在觀景台感受澎湃灰色水霧。可再走 10 分鐘看隔壁的 Selfoss 瀑布。',
 'vok-baths':'行程：連開兩小時外星荒原後身體很緊繃，來這裡泡在與湖水連成一線的浮動溫泉池中。泡完還能在休息區享用他們用天然地熱水沖泡的特製草本茶。',
 'seydisfjordur':'行程：一下山，彩虹小鎮與峽灣就在眼前，直接開去飯店 Check-in。\n傍晚：距日落還有兩小時，可漫步著名的彩虹路、藍色教堂，到港口邊看渡輪與峽灣倒影。',
 'gufufoss':'行程：下車拍照，這時通常空無一人。站在公路旁往回看，就是經典《白日夢冒險王》長板下山大斜坡視角。',
 'djupivogur':'拍照：先到港口邊的 Eggin í Gleðivík 拍一整排造型各異的鳥蛋石雕。\n午餐：到港口旁 Hafið bistro 吃招牌炸魚薯條，或到 N1 加油站簡單吃。\n補給：在這裡上廁所並加滿油——接下來到西角山前有一大段約 70 公里完全沒有城鎮。',
 'vestrahorn':'行程：穿過 Almannaskarð 隧道後轉 99 號公路，先在 Viking Cafe 販賣機購票（QR Code 可刷開車道柵欄），並在咖啡廳先上廁所。\n漫步：把車開進黑沙灘停車場走下沙灘，迎接下午微弱斜射光，尋找覆蓋一層薄海水、完全靜止的潮間帶，拍出上下完美對稱的天空之鏡！旁邊還有維京道具村可順道拍照。',
 'hofn-dinner':'行程：前往鎮上極有名的 Pakkhús Restaurant（不接受預約，須提早現場排隊）享用蒜香奶油烤冰島小龍蝦，或改去 Humarhöfnin 餐廳。',
 'jokulsarlon':'行程：漫步湖畔高地。這個時間點陽光角度剛好，照在漂浮的巨大千年藍冰上色彩極其透亮。記得找尋在冰塊間游泳探頭的野生海豹！',
 'diamond-beach':'行程：開車 2 分鐘到對面停車場，漫步純黑沙灘，近距離拍攝被大浪沖刷得像水晶般剔透的冰塊。\n安全叮嚀：此處海浪極大，拍照千萬不要背對大海！',
 'glacier-hike':'✅ 已預訂（Troll Expeditions・GetYourGuide）：日期 10/1，NT$41,755／8人。\n原文集合說明：Meet us at Troll.is - Skaftafell meeting point, 1km west of Hofgarður & 9km east of Falljökull Glacier；路邊可見免費私人停車場，嚮導在此迎接，行程結束回同一地點。\n⚠️ 時間：tour 14:30 出發，請 14:00（提早 30 分）抵達，否則喪失名額。此集合點在 Hof，不是 Skaftafell 遊客中心（在其東方約 25km）；從鑽石沙灘往西約 26km／30 分即達，今日行程緊湊，鑽石沙灘後直接前往 Hof、中途用餐整裝。\n行程：抵達後在小木屋報到，領取並匹配專用冰爪、冰斧與安全吊帶。\n夕陽亮點：17:30–18:49（日落前一小時）是整趟環島的視覺最高峰，秋季粉金逆光會把冰川與冰裂縫染成夢幻色彩。\n黑夜收尾：19:00 後天色全黑，在嚮導帶領下戴頭燈走下冰舌，體驗黑夜冰川的寂靜，極其酷炫！',
 'fjadrargjufur':'行程：清晨抵達，光線剛好照進深谷。順著鋪好的景觀步道上行，沿途有 3 個平台可俯瞰蛇行河流切穿苔蘚崖壁。爬到頂端觀景台拍完後，返回下停車場上廁所。',

let editMode=false;
const defaults={};

function initPrices(){
  document.querySelectorAll('.ep').forEach(el=>{
    const k=el.dataset.k;
    if(!k)return;
    defaults[k]=el.textContent;
    const saved=localStorage.getItem('pr_'+k);
    if(saved)el.textContent=saved;
  });
}

function toggleEdit(){
  editMode=!editMode;
  document.body.classList.toggle('editing',editMode);
  const btn=document.getElementById('editBtn');
  btn.textContent=editMode?'🔒 完成編輯':'✏️ 編輯價格';
  btn.classList.toggle('on',editMode);
}

function resetPrices(){
  if(!confirm('重設所有價格為預設值？'))return;
  document.querySelectorAll('.ep').forEach(el=>{
    const k=el.dataset.k;
    if(k&&defaults[k]){el.textContent=defaults[k];localStorage.removeItem('pr_'+k);}
  });
}

function clickPrice(el){
  if(!editMode)return;
  const k=el.dataset.k, orig=el.textContent;
  const inp=document.createElement('input');
  inp.className='ep-input'; inp.value=orig;
  el.style.visibility='hidden';
  el.after(inp); inp.focus(); inp.select();
  let committed=false;  // Bug B2 fix: prevent double-run on Escape
  const done=(saveVal)=>{
    if(committed)return; committed=true;
    const v=saveVal!==undefined?saveVal:inp.value;
    el.textContent=v||defaults[k]||orig;
    if(v)localStorage.setItem('pr_'+k,v);
    inp.remove(); el.style.visibility='';
  };
  inp.addEventListener('blur',()=>done());
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();done(inp.value);}
    if(e.key==='Escape'){e.preventDefault();done(orig);}  // pass orig → no save
  });
}

const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const div=(cls,txt)=>el('div',cls,txt);
const span=(cls,txt)=>el('span',cls,txt);

function makePrice(text,key){
  const s=span('ep',text);
  s.dataset.k=key;
  s.addEventListener('click',()=>clickPrice(s));
  return s;
}

//  BUILD DAY PANELS
// ════════════════════════════════════════════════════
function buildDayPanel(day){
  const p=div('panel');p.id='panel-'+day.day;
  const C=day.color;

  // sticky header
  const dh=div('d-head');dh.style.background=C;
  const dht=div('d-head-top');
  const dl=div('');
  dl.appendChild(div('d-num','Day '+day.day));
  dl.appendChild(div('d-name',day.title));
  const dm=div('d-meta');
  [['🚗',day.km],['🕐',day.drive]].forEach(([ic,v])=>{
    if(v&&v!=='―'){const s=span('',ic+' '+v);dm.appendChild(s);}
  });
  if(day.sunrise){dm.appendChild(span('','🌅 '+day.sunrise));dm.appendChild(span('','🌇 '+day.sunset));}
  dl.appendChild(dm);
  dht.appendChild(dl);dht.appendChild(div('d-date-badge',day.date));
  dh.appendChild(dht);p.appendChild(dh);

  // info bar
  const ib=div('d-infobar');
  [{l:'出發時間',v:day.depart},{l:'總里程',v:day.km},{l:'景點數',v:day.spots.length+'個'}].forEach(({l,v})=>{
    const d=div('dib');d.appendChild(div('dib-l',l));d.appendChild(div('dib-v',v));ib.appendChild(d);
  });
  p.appendChild(ib);

  // flights (D0)
  if(day.flights){
    const fb=div('flight-box');
    fb.appendChild(div('flight-title','✈ 班機資訊'));
    day.flights.forEach(f=>{
      const row=div('flight-row');
      row.appendChild(div('flight-who',f.who));
      row.appendChild(div('flight-info',f.info));
      fb.appendChild(row);
    });
    p.appendChild(fb);
  }

  // tips
  if(day.tips&&day.tips.length){
    const tb=div('tips-box');
    tb.appendChild(div('tips-title','⚡ 今日重點提醒'));
    day.tips.forEach(t=>tb.appendChild(div('tip-item',t)));
    p.appendChild(tb);
  }

  // timeline
  const tl=div('timeline');
  day.spots.forEach((sp,si)=>{
    // drive connector
    if(si>0&&sp.drv){
      const g=div('tl-gap');
      const gl=div('tl-gap-line');gl.style.background=C;
      g.appendChild(gl);g.appendChild(span('','🚗 '+sp.drv));
      tl.appendChild(g);
    }
    // spot row
    const row=div('tl-row');
    row.addEventListener('click',()=>flyToSpot(sp,day));

    const left=div('tl-left');
    const dot=div('tl-dot',sp._n);dot.style.background=C;
    left.appendChild(dot);
    if(si<day.spots.length-1){
      const vl=div('tl-vline');vl.style.background=C;left.appendChild(vl);
    }
    row.appendChild(left);

    const main=div('tl-main');
    if(sp.time){const t=div('tl-time',sp.time);t.style.color=C;main.appendChild(t);}
    main.appendChild(div('tl-zh',sp.zh));
    main.appendChild(div('tl-en',sp.en));

    // tags row
    const tagsDiv=div('tl-tags');
    // fee tag (editable)
    if(sp.fee){
      const ft=div('tt fee');
      ft.appendChild(span('','💰 '));
      const pr=makePrice(sp.fee,sp.feeKey);
      ft.appendChild(pr);
      tagsDiv.appendChild(ft);
    }
    if(sp.dur){const d=span('tt dur','⏱ '+sp.dur);tagsDiv.appendChild(d);}
    (sp.tags||[]).forEach(t=>{
      const cls='tt '+(t.startsWith('⚠️')?'warn':'tag');
      tagsDiv.appendChild(span(cls,t));
    });
    main.appendChild(tagsDiv);
    if(sp.desc)main.appendChild(div('tl-desc',sp.desc));
    // Google Maps button
    if(sp.lat){  // all spots with coordinates
      const gm=el('a','gmap-btn','🗺 Google Maps 導航');
      gm.href=`https://maps.google.com/?q=${sp.lat},${sp.lon}&z=15`;
      gm.target='_blank';
      gm.addEventListener('click',e=>e.stopPropagation()); // don't trigger flyToSpot
      main.appendChild(gm);
    }
    // booking button (confirmed experiences, e.g. glacier hike)
    if(sp.book&&sp.book.url){
      const bk=el('a','book-btn','✅ '+(sp.book.label||'已預訂'));
      bk.href=sp.book.url;
      bk.target='_blank';
      bk.addEventListener('click',e=>e.stopPropagation());
      main.appendChild(bk);
    }
    row.appendChild(main);

    // photo circle
    const photo=div('tl-photo loading');
    photo.style.borderColor=C;
    photo.id='ph-'+sp._n;
    row.appendChild(photo);
    setPhoto(sp,photo);

    tl.appendChild(row);
  });
  p.appendChild(tl);

  // restaurants
  if(day.restaurants&&day.restaurants.length){
    p.appendChild(div('section-head','🍴 今日餐廳推薦'));
    day.restaurants.forEach(r=>{
      const c=div('rest-card');
      c.appendChild(div('rest-name',r.name));
      const rt=div('rest-type',r.type);rt.style.color=C;c.appendChild(rt);
      c.appendChild(div('rest-note',r.note));
      const rq=r.name.split(/[（(]/)[0].trim();
      const rgm=el('a','gmap-btn','🔍 Google Maps 找');
      rgm.href='https://maps.google.com/?q='+encodeURIComponent(rq+' Iceland');
      rgm.target='_blank';rgm.rel='noopener';
      c.appendChild(rgm);
      p.appendChild(c);
    });
  }

  // accommodation
  const acc=div('acc-block');
  acc.style.borderLeftColor=C;
  acc.appendChild(div('acc-label','🏨 TODAY\'S ACCOMMODATION'));
  // Two travel groups: A團(卡致豆桓) / B團(豆林羅哈). Only tag teams when there is B-team info.
  const hasTeams=!!(day.acc.b||day.acc.bSame);
  if(hasTeams){
    const ta=div('acc-team-tag','A團 · 卡致豆桓');
    ta.style.color=C;ta.style.borderColor=C+'66';acc.appendChild(ta);
  }
  acc.appendChild(div('acc-name',day.acc.name));
  acc.appendChild(div('acc-sub',day.acc.sub+(day.acc.booking?' · '+day.acc.booking:'')));
  if(day.acc.geo){
    const agm=el('a','gmap-btn','🗺 Google Maps 找飯店');
    agm.href='https://maps.google.com/?q='+encodeURIComponent(day.acc.name.split(/[（(]/)[0].trim()+' Iceland');
    agm.target='_blank';agm.rel='noopener';acc.appendChild(agm);
  }
  const pr=div('acc-price-row');
  const editable=day.acc.price!=='―'&&day.acc.price!=='無住宿費';
  const badge=div('acc-price-badge'+(editable?' ep':''),day.acc.price);
  badge.dataset.k='acc-d'+day.day;
  badge.style.color=C;badge.style.borderColor=C+'44';badge.style.background=C+'15';
  if(editable)badge.addEventListener('click',()=>clickPrice(badge));
  pr.appendChild(badge);
  if(editable)pr.appendChild(div('acc-edit-hint','← 點✏️後可修改'));
  acc.appendChild(pr);
  // Team B (豆林羅哈)：同住或另訂
  if(day.acc.bSame){
    acc.appendChild(div('acc-team-same','🔗 B團（豆林羅哈）與 A團同住此處'));
  }else if(day.acc.b){
    const bWrap=div('acc-team-b');
    const tb=div('acc-team-tag','B團 · 豆林羅哈');
    tb.style.color=C;tb.style.borderColor=C+'66';bWrap.appendChild(tb);
    bWrap.appendChild(div('acc-name',day.acc.b.name));
    bWrap.appendChild(div('acc-sub',(day.acc.b.sub||'')+(day.acc.b.booking?' · '+day.acc.b.booking:'')));
    bWrap.appendChild(div('acc-team-note','B團住宿費 Sheet 未列'));
    acc.appendChild(bWrap);
  }
  // alternative / candidate accommodations (Sheet「未確認」備選)
  if(day.acc.alts&&day.acc.alts.length){
    const altWrap=div('acc-alts');
    altWrap.appendChild(div('acc-label','🔸 其他備選住宿'));
    day.acc.alts.forEach(a=>{
      const row=div('acc-alt-row');
      if(a.url){
        const link=el('a','acc-alt-link',a.name);
        link.href=a.url;link.target='_blank';link.rel='noopener';
        row.appendChild(link);
      }else{
        row.appendChild(span('acc-alt-name',a.name));
      }
      if(a.price&&a.price!=='—')row.appendChild(span('acc-alt-price',a.price));
      altWrap.appendChild(row);
    });
    acc.appendChild(altWrap);
  }
  p.appendChild(acc);
  return p;
}

const pc={};        // wiki → url (null=pending, false=failed)

  if(pc[wiki]){  // already resolved with a URL
    if(targetEl){targetEl.style.backgroundImage='url('+pc[wiki]+')';targetEl.classList.remove('loading');}
    return;
  }
  if(pc[wiki]===false){if(targetEl)targetEl.classList.remove('loading');return;}  // known failure
  if(pc[wiki]===null){  // fetch in progress → queue target
    if(targetEl)(pcQ[wiki]=pcQ[wiki]||[]).push(targetEl);
    return;
  }
  // First request for this wiki
  pc[wiki]=null;
  if(targetEl)(pcQ[wiki]=[]).push(targetEl);
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(wiki))
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      const url=d?.thumbnail?.source||null;
      pc[wiki]=url||false;
      (pcQ[wiki]||[]).forEach(el=>{
        if(!el)return;
        if(url)el.style.backgroundImage='url('+url+')';
        el.classList.remove('loading');
      });
    }).catch(()=>{pc[wiki]=false;(pcQ[wiki]||[]).forEach(el=>{if(el)el.classList.remove('loading');});});
}

// Prefer a curated image (sp.img); otherwise fall back to Wikipedia thumbnail
function setPhoto(sp,el){
  if(!el)return;
  if(sp.img){el.style.backgroundImage='url('+sp.img+')';el.classList.remove('loading');return;}
  if(sp.wiki){getPhoto(sp.wiki,el);return;}
  el.classList.remove('loading');
}

function mkIcon(num,col,dim){
  return L.divIcon({className:'',
    html:'<div style="width:30px;height:30px;background:'+col+';border:2.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px;font-family:Microsoft JhengHei,Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.5);opacity:'+(dim?'.22':'1')+';cursor:pointer">'+num+'</div>',
    iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-18]});
}

// short drive-time text for a segment label ('' → skip). 步行/同 → 🚶 else 🚗
function segText(drv){
  if(!drv) return '';
  const t=drv.split('（')[0].trim();
  if(!t) return '';
  const walk=/步行|同/.test(t);
  return (walk?'🚶 ':'🚗 ')+t;
}
// screen-space bearing (deg) for an arrow glyph that points east (➤) by default
function bearing(a,b){
  const dLon=(b[1]-a[1])*Math.cos((a[0]+b[0])/2*Math.PI/180);
  const dLat=(b[0]-a[0]);
  return -Math.atan2(dLat,dLon)*180/Math.PI;
}
function mkArrow(angle,col,dim){
  return L.divIcon({className:'',
    html:'<div class="seg-arrow" style="transform:rotate('+angle+'deg);color:'+col+';opacity:'+(dim?'.28':'.95')+'">➤</div>',
    iconSize:[16,16],iconAnchor:[8,8]});
}
function mkSegPill(text,warn){
  return L.divIcon({className:'',
    html:'<div class="seg-label'+(warn?' warn':'')+'">'+text+(warn?' ⚠️':'')+'</div>',
    iconSize:[0,0],iconAnchor:[0,0]});
}

DAYS.forEach(day=>{
  if(day.isD0)return;
  const lls=day.spots.map(s=>[s.lat,s.lon]);
  const C=day.color;
  const glow=L.polyline(lls,{color:C,weight:11,opacity:.14,lineJoin:'round'}).addTo(map);
  const line=L.polyline(lls,{color:C,weight:4.5,opacity:.9,lineJoin:'round'}).addTo(map);
  const marks=day.spots.map(sp=>{
    const mk=L.marker([sp.lat,sp.lon],{icon:mkIcon(sp._n,C,false)});
    mk.bindPopup(()=>popupHtml(sp,day),{maxWidth:270,minWidth:260,className:''});
    mk.on('click',()=>{activateDay(day.day,false);requestAnimationFrame(scrollMapIntoView);});
    mk.addTo(map);
    return mk;
  });
  // direction arrows (always on map, dim with route) + drive-time pills (active-day only)
  const arrows=[], segLabels=[];
  for(let i=1;i<day.spots.length;i++){
    const a=[day.spots[i-1].lat,day.spots[i-1].lon], b=[day.spots[i].lat,day.spots[i].lon];
    if(a[0]===b[0]&&a[1]===b[1])continue;               // same point → skip
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const ang=bearing(a,b);
    const ar=L.marker(mid,{icon:mkArrow(ang,C,false),interactive:false,keyboard:false});
    ar._ang=ang; ar.addTo(map); arrows.push(ar);
    const txt=segText(day.spots[i].drv);
    if(!txt)continue;
    const caution=SEG_CAUTION[day.spots[i].feeKey];
    const pill=L.marker(mid,{icon:mkSegPill(txt,!!caution)});
    if(caution)pill.bindPopup('<div style="font:12px/1.6 Microsoft JhengHei,Arial;color:#f2c53d;max-width:220px">⚠️ '+caution+'</div>',{className:''});
    segLabels.push(pill);                                // NOT added to map yet
  }
  // accommodation bed marker (added to map only when its day is active — see showBeds)
  let bed=null;
  if(day.acc&&day.acc.geo){
    bed=L.marker(day.acc.geo,{icon:mkBedIcon(C),zIndexOffset:1000});
    bed.bindPopup(()=>accPopupHtml(day),{maxWidth:270,minWidth:240,className:''});
  }
  layers[day.day]={glow,line,marks,arrows,segLabels,bed,day};
});

function activateDay(dayNum,flyTo=true){
  current=dayNum;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  const panel=document.getElementById('panel-'+dayNum);
  if(panel){panel.classList.add('on');panel.scrollTop=0;}
  document.querySelectorAll('.dtab').forEach(b=>b.classList.remove('on'));
  const tb=document.getElementById('dtab-'+dayNum);
  if(tb)tb.classList.add('on');
  document.getElementById('allBtn').classList.remove('on');
  document.getElementById('prepBtn').classList.remove('on');
  // map opacity  (Bug B1 fix: D0 has no Iceland layer → show all normally)
  const hasLayer=!!layers[dayNum];
  DAYS.forEach(d=>{
    if(!layers[d.day])return;
    const on=!hasLayer||d.day===dayNum;  // if no layer for selected day, show all
    const{glow,line,marks,arrows}=layers[d.day];
    line.setStyle({opacity:on?.9:.1,weight:on?5:2});
    glow.setStyle({opacity:on?.18:.03});
    d.spots.forEach((sp,i)=>marks[i].setIcon(mkIcon(sp._n,d.color,!on)));
    arrows.forEach(ar=>ar.setIcon(mkArrow(ar._ang,d.color,!on)));
  });
  showSegLabels(hasLayer?dayNum:null);
  showBeds(hasLayer?dayNum:null);
  if(flyTo&&layers[dayNum]){
    const day=DAYS.find(d=>d.day===dayNum);
    if(day){
      const bounds=L.latLngBounds(day.spots.map(s=>[s.lat,s.lon]));
      map.flyToBounds(bounds,{padding:[85,85],maxZoom:10,duration:.75});
    }
  }
}

let _flyTimeout=null;
function flyToSpot(sp,day){
  if(!sp.lat||sp.lat<50)return; // skip non-Iceland (Taiwan lat≈25, Iceland lat≈63-66)
  if(_flyTimeout){clearTimeout(_flyTimeout);_flyTimeout=null;}
  scrollMapIntoView();
  map.flyTo([sp.lat,sp.lon],11,{duration:.7});
  _flyTimeout=setTimeout(()=>{
    _flyTimeout=null;
    if(!layers[day.day])return;
    layers[day.day].marks.forEach((mk,i)=>{
      if(day.spots[i]===sp)mk.openPopup();
    });
  },800);
}

(function(){
  const inp=document.getElementById('spotSearch');
  const box=document.getElementById('searchResults');
  if(!inp||!box)return;
  const INDEX=[];
  DAYS.forEach(day=>day.spots.forEach(sp=>{ if(sp.lat&&sp.lat>50) INDEX.push({sp,day}); }));
  let sel=-1, cur=[];
  const hide=()=>{box.classList.remove('on');box.innerHTML='';sel=-1;cur=[];};
  const paint=()=>{[...box.children].forEach((c,i)=>c.classList.toggle('sel',i===sel));};
  const go=(i)=>{const item=cur[i];if(!item)return;inp.value='';hide();activateDay(item.day.day,false);flyToSpot(item.sp,item.day);};
  const render=()=>{
    const q=inp.value.trim().toLowerCase();
    if(!q){hide();return;}
    cur=INDEX.filter(({sp})=>(sp.zh+' '+sp.en).toLowerCase().includes(q)).slice(0,8);
    box.innerHTML='';
    if(!cur.length){box.appendChild(el('div','search-empty','找不到景點 No match'));box.classList.add('on');return;}
    cur.forEach(({sp,day},i)=>{
      const it=div('search-item');
      const dot=div('si-dot',String(sp._n));dot.style.background=day.color;
      const t=div('');t.appendChild(div('si-zh',sp.zh));t.appendChild(div('si-en','D'+day.day+' · '+sp.en));
      it.appendChild(dot);it.appendChild(t);
      it.addEventListener('mousedown',e=>{e.preventDefault();go(i);});
      box.appendChild(it);
    });
    box.classList.add('on');sel=-1;
  };
  inp.addEventListener('input',render);
  inp.addEventListener('keydown',e=>{
    if(!cur.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,cur.length-1);paint();}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);paint();}
    else if(e.key==='Enter'){e.preventDefault();go(sel<0?0:sel);}
    else if(e.key==='Escape'){hide();inp.blur();}
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.sb-search'))hide(); });
})();

// ── PWA service worker (offline) ──
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// ════════════════════════════════════════════════════
//  SIDEBAR RESIZE  (desktop drag handle)
// ════════════════════════════════════════════════════
(function(){
  const sb=document.getElementById('sidebar');
  const rz=document.getElementById('resizer');
  if(!sb||!rz)return;
  let dragging=false;
  const MIN=380;                                   // sidebar never narrower than this
  const mapMin=320;                                // map keeps at least this width
  const apply=x=>{
    const max=window.innerWidth-mapMin-6;
    sb.style.width=Math.max(MIN,Math.min(max,x))+'px';
  };
  rz.addEventListener('mousedown',e=>{
    dragging=true;rz.classList.add('dragging');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{ if(dragging)apply(e.clientX); });
  window.addEventListener('mouseup',()=>{
    if(!dragging)return;
    dragging=false;rz.classList.remove('dragging');
    document.body.style.cursor='';document.body.style.userSelect='';
    map.invalidateSize();
  });
  // double-click handle → reset to default width
  rz.addEventListener('dblclick',()=>{ sb.style.width='600px';map.invalidateSize(); });
})();

// keep Leaflet in sync when layout switches (resize / rotate / mobile stack)
let _rsz=null;
window.addEventListener('resize',()=>{
  clearTimeout(_rsz);
  _rsz=setTimeout(()=>map.invalidateSize(),150);
});
// ensure correct map size after initial layout (esp. mobile stacked layout)
setTimeout(()=>map.invalidateSize(),250);
</script>
